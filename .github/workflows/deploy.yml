name: Deploy PEYEX to GitHub Pages

on:
  push:
    branches: ["main"] # Cambia a tu rama principal si es otra (ej. master)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build PEYEX
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: "./dist" # Cámbialo a "./build" o "./" según dónde genere tu build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
